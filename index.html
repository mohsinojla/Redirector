<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<meta http-equiv="refresh" content="0">
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #111;
    color: #eee;
  }
  a { color: #4da6ff; }
</style>
</head>
<body>
<p id="msg">Redirecting&hellip; if you are not redirected, <a id="link" href="#">click here</a>.</p>
<script>
  fetch('redirect.json?_=' + Date.now())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.url) {
        document.getElementById('link').href = data.url;
        window.location.replace(data.url);
      }
    })
    .catch(function (err) {
      document.getElementById('msg').textContent = 'Could not load redirect target.';
      console.error(err);
    });
</script>
</body>
</html>
